version: "3.9"

services:
  redis-primary:
    image: redis:7.2
    container_name: redis-primary
    ports:
      - "6379:6379"
    volumes:
      - ./redis/primary/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - rate-limit-net

  redis-replica:
    image: redis:7.2
    container_name: redis-replica
    depends_on:
      - redis-primary
    ports:
      - "6380:6379"
    volumes:
      - ./redis/replica/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - rate-limit-net

  sentinel-1:
    image: redis:7.2
    container_name: sentinel-1
    depends_on:
      - redis-primary
      - redis-replica
    ports:
      - "26379:26379"
    volumes:
      - ./sentinel/sentinel-1.conf:/usr/local/etc/redis/sentinel.conf
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    networks:
      - rate-limit-net

  sentinel-2:
    image: redis:7.2
    container_name: sentinel-2
    depends_on:
      - redis-primary
      - redis-replica
    ports:
      - "26380:26379"
    volumes:
      - ./sentinel/sentinel-2.conf:/usr/local/etc/redis/sentinel.conf
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    networks:
      - rate-limit-net

  sentinel-3:
    image: redis:7.2
    container_name: sentinel-3
    depends_on:
      - redis-primary
      - redis-replica
    ports:
      - "26381:26379"
    volumes:
      - ./sentinel/sentinel-3.conf:/usr/local/etc/redis/sentinel.conf
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    networks:
      - rate-limit-net

networks:
  rate-limit-net:
    driver: bridge